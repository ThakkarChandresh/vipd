[package]
name = "vipd"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Cross-platform virtual IP failover daemon"
repository = "https://github.com/ThakkarChandresh/vipd"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
hmac = "0.13"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1.53", features = ["rt", "net", "time", "process", "signal", "macros", "sync", "io-util"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
tracing-appender = "0.2"
windows-service = "0.7"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
] }

[dev-dependencies]
tokio = { version = "1.53", features = ["test-util"] }
